<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Yuktha Ramesh Gowda. On building agentic AI systems that are safe to ship. AI Engineer; Graduate Research Assistant, Stevens Institute of Technology. Abstract: I design and build agentic AI systems: multi-step LLM workflows, retrieval-augmented generation, and the deterministic checks that keep them honest. I previously shipped LLM screening features at Zennial Pro. Today I build agent pipelines at Stevens and am working on a recruitment platform. My work has appeared at an IEEE conference and in TIJER." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C1C1A"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B5442A"/></marker></defs><style>.sf{font-family:Charter,'Bitstream Charter','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.sn{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.ul{stroke-dasharray:500;animation:draw 1.6s .4s ease-out backwards}@keyframes draw{from{stroke-dashoffset:500}to{stroke-dashoffset:0}}.cur{animation:k 1.1s steps(1) infinite}@keyframes k{50%{opacity:0}}</style><rect x="1" y="1" width="1198" height="518" rx="6" fill="#FBFAF6" stroke="#D9D5CC" stroke-width="1.5"/><text transform="translate(40 480) rotate(-90)" class="m" font-size="12.5" fill="#6E6B64" letter-spacing="1.5">yuktha:2026.11 [cs.AI]  ·  profile v2  ·  5 Nov 2026</text><line x1="90" y1="62" x2="1130" y2="62" stroke="#1C1C1A" stroke-width="1"/><text x="90" y="50" class="m" font-size="11.5" fill="#6E6B64" letter-spacing="2">PREPRINT</text><text x="1130" y="50" text-anchor="end" class="m" font-size="11.5" fill="#6E6B64" letter-spacing="2">NOT PEER-REVIEWED · TESTED IN PRODUCTION</text><text x="610" y="142" text-anchor="middle" class="sf" font-size="56" font-weight="700" fill="#1C1C1A" letter-spacing="-.5">Yuktha Ramesh Gowda</text><text x="610" y="188" text-anchor="middle" class="sf" font-size="25" font-style="italic" fill="#1C1C1A">On building agentic AI systems that are safe to ship</text><path d="M372 204 C 470 198, 600 210, 720 201 S 830 199, 848 203" fill="none" stroke="#B5442A" stroke-width="2.5" stroke-linecap="round" class="ul"/><text x="610" y="240" text-anchor="middle" class="sf" font-size="18" fill="#1C1C1A">AI Engineer<tspan baseline-shift="super" font-size="12">1</tspan>  ·  Graduate Research Assistant<tspan baseline-shift="super" font-size="12">2</tspan></text><text x="610" y="264" text-anchor="middle" class="sf" font-size="14.5" font-style="italic" fill="#6E6B64"><tspan font-size="11" baseline-shift="super">1</tspan>open to AI Engineer roles, 2026   <tspan font-size="11" baseline-shift="super">2</tspan>Stevens Institute of Technology, New Jersey, USA</text><rect x="150" y="292" width="920" height="192" fill="#EFECE4" opacity=".55"/><text x="610" y="322" text-anchor="middle" class="sf" font-size="15" font-weight="700" fill="#1C1C1A" letter-spacing="3">ABSTRACT</text><text x="186" y="352" class="sf" font-size="18" fill="#1C1C1A">I design and build agentic AI systems: multi-step LLM workflows, retrieval-augmented</text><text x="186" y="378" class="sf" font-size="18" fill="#1C1C1A">generation, and the deterministic checks that keep them honest. I previously shipped LLM</text><text x="186" y="404" class="sf" font-size="18" fill="#1C1C1A">screening features at Zennial Pro. Today I build agent pipelines at Stevens and am working</text><text x="186" y="430" class="sf" font-size="18" fill="#1C1C1A">on a recruitment platform. My work has appeared at an IEEE conference and in TIJER.</text><text x="186" y="462" class="sf" font-size="15.5" fill="#6E6B64"><tspan font-style="italic" fill="#1C1C1A">Keywords:</tspan> agents · RAG · LLM evaluation · tool calling · guardrails<tspan class="cur" fill="#B5442A"> ▍</tspan></text></svg>