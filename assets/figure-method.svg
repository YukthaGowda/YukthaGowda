<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Figure 1. The loop I design for: query, retriever, planner with tools, validator, output. Drafts that fail a check go back to the planner for revision." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C1C1A"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B5442A"/></marker></defs><style>.sf{font-family:Charter,'Bitstream Charter','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.sn{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.flow{animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-22}}</style><rect x="1" y="1" width="1198" height="428" rx="6" fill="#FBFAF6" stroke="#D9D5CC" stroke-width="1.5"/><text x="64" y="56" class="sf" font-size="24" font-weight="700" fill="#1C1C1A"><tspan fill="#B5442A">1</tspan>   Method</text><line x1="232" y1="180" x2="282" y2="180" stroke="#1C1C1A" stroke-width="1.5" marker-end="url(#ah)"/><line x1="452" y1="180" x2="502" y2="180" stroke="#1C1C1A" stroke-width="1.5" marker-end="url(#ah)"/><line x1="672" y1="180" x2="722" y2="180" stroke="#1C1C1A" stroke-width="1.5" marker-end="url(#ah)"/><line x1="892" y1="180" x2="942" y2="180" stroke="#1C1C1A" stroke-width="1.5" marker-end="url(#ah)"/><circle r="5" fill="#B5442A"><animateMotion dur="4.5s" repeatCount="indefinite" path="M148.0 180 H1028.0" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="4.5s" repeatCount="indefinite"/></circle><rect x="64" y="145.0" width="168" height="70" rx="4" fill="#fff" stroke="#1C1C1A" stroke-width="1.5"/><text x="148.0" y="176" text-anchor="middle" class="sf" font-size="20" font-weight="700" fill="#1C1C1A">Query</text><text x="148.0" y="199" text-anchor="middle" class="m" font-size="12" fill="#6E6B64">user intent</text><rect x="284" y="145.0" width="168" height="70" rx="4" fill="#fff" stroke="#1C1C1A" stroke-width="1.5"/><text x="368.0" y="176" text-anchor="middle" class="sf" font-size="20" font-weight="700" fill="#1C1C1A">Retriever</text><text x="368.0" y="199" text-anchor="middle" class="m" font-size="12" fill="#6E6B64">ChromaDB · embeddings</text><rect x="504" y="145.0" width="168" height="70" rx="4" fill="#fff" stroke="#1C1C1A" stroke-width="1.5"/><text x="588.0" y="176" text-anchor="middle" class="sf" font-size="20" font-weight="700" fill="#1C1C1A">Planner</text><text x="588.0" y="199" text-anchor="middle" class="m" font-size="12" fill="#6E6B64">LLM · LangGraph</text><rect x="724" y="145.0" width="168" height="70" rx="4" fill="#fff" stroke="#B5442A" stroke-width="2.2"/><text x="808.0" y="176" text-anchor="middle" class="sf" font-size="20" font-weight="700" fill="#B5442A">Validator</text><text x="808.0" y="199" text-anchor="middle" class="m" font-size="12" fill="#6E6B64">rule-based checks</text><rect x="944" y="145.0" width="168" height="70" rx="4" fill="#fff" stroke="#1C1C1A" stroke-width="1.5"/><text x="1028.0" y="176" text-anchor="middle" class="sf" font-size="20" font-weight="700" fill="#1C1C1A">Output</text><text x="1028.0" y="199" text-anchor="middle" class="m" font-size="12" fill="#6E6B64">cited · traced</text><rect x="504" y="272" width="168" height="56" rx="4" fill="#fff" stroke="#1C1C1A" stroke-width="1.5" stroke-dasharray="5 4"/><text x="588.0" y="297" text-anchor="middle" class="sf" font-size="18" font-weight="700" fill="#1C1C1A">Tools</text><text x="588.0" y="316" text-anchor="middle" class="m" font-size="12" fill="#6E6B64">APIs · functions</text><line x1="570.0" y1="217.0" x2="570.0" y2="270" stroke="#1C1C1A" stroke-width="1.5" marker-end="url(#ah)"/><line x1="606.0" y1="270" x2="606.0" y2="217.0" stroke="#1C1C1A" stroke-width="1.5" marker-end="url(#ah)"/><text x="618.0" y="248.5" class="sf" font-size="14" font-style="italic" fill="#6E6B64">call / observe</text><path d="M808.0 143.0 C 808.0 70, 588.0 70, 588.0 141.0" fill="none" stroke="#B5442A" stroke-width="1.8" stroke-dasharray="6 5" class="flow" marker-end="url(#aa)"/><text x="698.0" y="78" text-anchor="middle" class="sf" font-size="15" font-style="italic" fill="#B5442A">check failed → revise</text><text x="64" y="378" class="sf" font-size="16" fill="#1C1C1A"><tspan font-weight="700">Figure 1.</tspan> The loop I design for. Ground the model in retrieved evidence, let it plan and call tools,</text><text x="64" y="401" class="sf" font-size="16" fill="#1C1C1A">then check every draft deterministically before it ships. Drafts that fail a check go back for revision.</text></svg>